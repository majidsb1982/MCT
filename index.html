<style>














:root{--p:#2563eb;--p2:#38bdf8;--pg:linear-gradient(135deg,#2563eb,#38bdf8);--pg2:linear-gradient(135deg,#3b82f6,#60a5fa);
--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--prob:#f97316;
--bg:#f4f7fe;--sf:#ffffff;--sf2:#eef4fd;--tx:#1e293b;--tx2:#64748b;--ln:#e3eaf5;
--blue-t:#2563eb14;--sh:0 6px 20px rgba(37,99,235,.08);--sh2:0 4px 12px rgba(37,99,235,.12);--r:16px}
body.dark{--bg:#0b1220;--sf:#141e33;--sf2:#1c2a45;--tx:#f1f5f9;--tx2:#8ea0bd;--ln:#24334f;--blue-t:#2563eb22;--sh:0 6px 20px rgba(0,0,0,.4);--sh2:0 4px 12px rgba(0,0,0,.35)}
body.c-teal{--p:#0d9488;--p2:#2dd4bf;--pg:linear-gradient(135deg,#0d9488,#2dd4bf);--pg2:linear-gradient(135deg,#14b8a6,#5eead4);--blue-t:#0d948814}
body.dark.c-teal{--blue-t:#0d948822}
body.c-purple{--p:#7c3aed;--p2:#a78bfa;--pg:linear-gradient(135deg,#7c3aed,#a78bfa);--pg2:linear-gradient(135deg,#8b5cf6,#c4b5fd);--blue-t:#7c3aed14}
body.dark.c-purple{--blue-t:#7c3aed22}
body.c-warm{--p:#ea580c;--p2:#fb923c;--pg:linear-gradient(135deg,#ea580c,#fb923c);--pg2:linear-gradient(135deg,#f97316,#fdba74);--blue-t:#ea580c14}
body.dark.c-warm{--blue-t:#ea580c22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:var(--fs,15px);padding:60px 0 80px;transition:background .25s,color .25s}
h3{font-size:1em;margin:0 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.card.hero{background:var(--pg);border:none;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(37,99,235,.3)}
body.c-teal .card.hero{box-shadow:0 8px 24px rgba(13,148,136,.3)}
body.c-purple .card.hero{box-shadow:0 8px 24px rgba(124,58,237,.3)}
body.c-warm .card.hero{box-shadow:0 8px 24px rgba(234,88,12,.3)}
.card.hero::before{content:"";position:absolute;top:-50px;left:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.13)}
.card.hero h3{color:rgba(255,255,255,.9)}
.page{padding:12px;max-width:640px;margin:0 auto;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
header{position:fixed;top:0;right:0;left:0;z-index:60;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--ln)}
.hwrap{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--pg);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.3)}
.htitle{font-weight:800;font-size:clamp(.9em,4vw,1.05em)}.hsub{font-size:.64em;color:var(--tx2)}
.hbtn{background:var(--sf);border:1px solid var(--ln);border-radius:11px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1em;box-shadow:var(--sh);flex-shrink:0}
.hbtn.first{margin-right:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:none;border-radius:13px;padding:11px 16px;font-family:inherit;font-size:.97em;font-weight:700;cursor:pointer;min-height:44px;background:var(--sf2);color:var(--tx);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--pg);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.btn.g{background:linear-gradient(135deg,#10b981,#34d399);color:#fff}
.btn.d{background:linear-gradient(135deg,#ef4444,#f87171);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--ln)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:.86em;border-radius:11px}
.chip{border:1.5px solid var(--ln);background:var(--sf);color:var(--tx2);border-radius:99px;padding:7px 14px;font-family:inherit;font-size:.83em;font-weight:700;cursor:pointer;min-height:38px;transition:.15s}
.chip.on{background:var(--pg);color:#fff;border-color:transparent}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--ln);border-radius:13px;background:var(--sf);color:var(--tx);font-family:inherit;font-size:.97em;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 3px var(--blue-t)}
textarea{min-height:85px;resize:vertical}
label{display:block;font-size:.82em;color:var(--tx2);margin:8px 0 4px;font-weight:600}
nav{position:fixed;bottom:0;right:0;left:0;z-index:60;display:flex;justify-content:space-around;align-items:center;background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 0 max(8px,env(safe-area-inset-bottom))}
nav button{background:none;border:none;color:var(--tx2);font-family:inherit;font-size:.63em;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 7px;cursor:pointer;min-width:48px;border-radius:13px;transition:.15s}
nav button.on{color:#fff;background:var(--pg);box-shadow:0 3px 12px rgba(37,99,235,.3)}
nav svg{width:20px;height:20px;fill:currentColor}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72em;font-weight:800}
.b-ok{background:#10b98118;color:#059669}.b-warn{background:#f59e0b18;color:#b45309}.b-bad{background:#ef444418;color:#dc2626}.b-prob{background:#f9731618;color:#c2410c}.b-p{background:var(--blue-t);color:var(--p)}.b-m{background:#64748b14;color:var(--tx2)}
body.dark .b-ok{color:#34d399}body.dark .b-warn{color:#fbbf24}body.dark .b-bad{color:#f87171}body.dark .b-prob{color:#fb923c}body.dark .b-p{color:#93c5fd}
.toast{position:fixed;bottom:92px;right:50%;transform:translateX(50%);background:var(--sf);border:1px solid var(--ln);color:var(--tx);padding:11px 20px;border-radius:99px;box-shadow:var(--sh2);opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:92vw;font-size:.9em;font-weight:600;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;pointer-events:auto}
.toast button{border:none;background:var(--p);color:#fff;border-radius:99px;padding:5px 13px;font-family:inherit;font-weight:800;cursor:pointer;font-size:.9em}
.toast.celebrate{background:var(--pg);color:#fff;border:none;font-size:1.05em;animation:pop .4s}
@keyframes pop{0%{transform:translateX(50%) scale(.5);opacity:0}60%{transform:translateX(50%) scale(1.15)}100%{transform:translateX(50%) scale(1);opacity:1}}
.overlay{position:fixed;inset:0;background:rgba(30,58,110,.35);backdrop-filter:blur(5px);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:in .15s}
.modal{background:var(--sf);border-radius:20px;padding:20px;width:100%;max-width:430px;max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(30,58,110,.3)}
.mem{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.mem:last-child{border:none}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--pg2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;box-shadow:0 2px 7px rgba(37,99,235,.22);object-fit:cover;border:none}
.st-btn{flex:1;border:none;border-radius:11px;padding:11px 2px;font-family:inherit;font-size:.84em;font-weight:800;cursor:pointer;background:var(--sf2);color:var(--tx2);min-height:46px;transition:.12s}
.st-btn:active{transform:scale(.94)}
.st-btn.on1{background:linear-gradient(135deg,#10b981,#34d399);color:#fff}
.st-btn.on2{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#3b2a00}
.st-btn.on3{background:linear-gradient(135deg,#ef4444,#f87171);color:#fff}
.st-btn.on4{background:linear-gradient(135deg,#f97316,#fb923c);color:#fff}
.entry-body .st-btn{min-height:54px;font-size:.95em}
.entry-body .mem b{font-size:1.1em}
.entry-body .avatar{width:46px;height:46px}
.timer-sm{font-size:clamp(1.6em,8vw,2em);font-weight:900;text-align:center;direction:ltr;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#fff,#bfdbfe);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.alert-screen{position:fixed;inset:0;background:var(--pg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:in .35s}
.alert-screen .msg{font-size:clamp(1.4em,7vw,1.9em);font-weight:900;color:#fff;margin:14px 0;line-height:1.6;text-shadow:0 2px 18px rgba(0,0,0,.2)}
.alert-screen .btn{background:#fff;color:#1d4ed8;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.empty{text-align:center;color:var(--tx2);padding:22px 10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal-grid button{border:none;background:var(--sf2);color:var(--tx);border-radius:11px;min-height:42px;font-family:inherit;cursor:pointer;font-size:.9em;font-weight:700}
.cal-grid button.today{border:2px solid var(--p2);color:var(--p);font-weight:800}
.cal-grid button.sel{background:var(--pg);color:#fff;border-color:transparent}
.cal-grid .hd{background:none;color:var(--tx2);font-size:.7em;min-height:24px;font-weight:700}
.focus-banner{background:linear-gradient(135deg,#fef3c7,#ffedd5);border:1px solid #fcd34d66;border-radius:12px;padding:9px 13px;font-size:.83em;font-weight:700;color:#b45309;margin-bottom:10px}
body.dark .focus-banner{background:#f59e0b18;border-color:#f59e0b44;color:#fbbf24}
.entry-head{position:fixed;top:0;right:0;left:0;z-index:70;background:var(--pg);color:#fff;padding:10px 14px 14px;box-shadow:0 8px 24px rgba(37,99,235,.35);border-radius:0 0 22px 22px}
.entry-head .btn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.28);min-height:38px;padding:7px 12px}
.entry-head .chip{border:none;min-height:36px;padding:6px 13px}
.entry-body{padding:196px 12px 30px;max-width:640px;margin:0 auto}
.mem.done{background:#10b9810a;border:1px solid #10b98144;border-radius:13px;padding:9px 11px}
.mem.payrow{cursor:pointer}
.stat-line{font-size:.8em;color:var(--tx2)}
.stat-ico{width:36px;height:36px;border-radius:11px;background:var(--blue-t);display:flex;align-items:center;justify-content:center;font-size:1.05em;flex-shrink:0}
.progress{height:7px;border-radius:99px;background:var(--sf2);overflow:hidden;margin:6px 0 3px}
.progress i{display:block;height:100%;background:var(--pg);border-radius:99px;transition:width .3s}
.task-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.task-row:last-child{border:none}
.task-row .t-title{font-weight:700}
.task-row .t-sub{font-size:.78em;color:var(--tx2)}
.task-row .t-go{margin-right:auto;color:var(--p);font-weight:900;font-size:1.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.swatch{width:38px;height:38px;border-radius:12px;cursor:pointer;border:3px solid transparent;flex:1;min-height:44px}
.swatch.on{border-color:var(--tx)}
.ph-pick{display:flex;align-items:center;gap:12px;margin:8px 0}
.ph-pick img{width:64px;height:64px;border-radius:16px;object-fit:cover;box-shadow:var(--sh)}
.ph-pick .ph-empty{width:64px;height:64px;border-radius:16px;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-size:1.5em;border:1.5px dashed var(--ln)}
.rec-time{font-size:2em;font-weight:900;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}
/* هایلایت بازگشت بعد از تماس */
@keyframes hl{0%,100%{background:transparent}25%,75%{background:var(--blue-t)}}
.mblk.hl{animation:hl 2.4s ease;border-radius:12px;outline:2px solid var(--p2)}
@media print{header,nav,.btn,nav *,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}}



/* ===== MCT v6 — Modern UI ===== */
:root{--blur:12px;--glass:rgba(255,255,255,.72);--ease:cubic-bezier(.22,1,.36,1)}
body.dark{--glass:rgba(20,30,51,.75)}
@supports (backdrop-filter:blur(1px)){
  .card{background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
  header,.nav-glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
}
.card{transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.card:active{transform:scale(.985)}
.btn{transition:transform .15s var(--ease),opacity .15s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn.p{box-shadow:0 4px 14px color-mix(in srgb,var(--p) 35%,transparent)}
.st-btn{transition:transform .12s,background .15s,border-color .15s}
.st-btn:active{transform:scale(.94)}
.ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-wrap .ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95em}
.insight{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.insight .ic{background:var(--sf2);border-radius:14px;padding:12px;text-align:center;border:1px solid var(--ln)}
.insight .ic b{display:block;font-size:1.25em;font-weight:900;color:var(--p);margin-top:2px}
.insight .ic span{font-size:.75em;color:var(--tx2)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;direction:ltr}
.heat .hd{font-size:.65em;color:var(--tx2);text-align:center;padding:2px}
.heat .c{aspect-ratio:1;border-radius:6px;background:var(--sf2);border:1px solid var(--ln);cursor:pointer;transition:transform .12s}
.heat .c:hover{transform:scale(1.12)}
.heat .c.lv1{background:#bfdbfe;border-color:#93c5fd}
.heat .c.lv2{background:#60a5fa;border-color:#3b82f6}
.heat .c.lv3{background:#2563eb;border-color:#1d4ed8}
.heat .c.lv4{background:#1e3a8a;border-color:#1e3a8a}
body.dark .heat .c.lv1{background:#1e3a5f}
body.dark .heat .c.lv2{background:#1e40af}
body.dark .heat .c.lv3{background:#2563eb}
body.dark .heat .c.lv4{background:#3b82f6}
.spark{display:flex;align-items:flex-end;gap:3px;height:40px;padding:4px 0}
.spark i{flex:1;background:var(--pg);border-radius:3px 3px 0 0;min-height:3px;opacity:.85;transition:height .3s var(--ease)}
.chip-mic{display:inline-flex;align-items:center;gap:4px}
.chip-mic.rec{animation:pulse-rec 1s infinite;border-color:var(--bad);color:var(--bad)}
@keyframes pulse-rec{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-up{animation:fade-up .35s var(--ease) both}
.stagger>*{animation:fade-up .4s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.1s}
.stagger>*:nth-child(4){animation-delay:.14s}
.stagger>*:nth-child(5){animation-delay:.18s}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
.skeleton{background:linear-gradient(90deg,var(--sf2) 25%,var(--ln) 50%,var(--sf2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;height:14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.badge-ai{background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff;font-size:.68em;padding:2px 7px;border-radius:6px;font-weight:800}
.fab-ai{position:fixed;bottom:88px;left:16px;z-index:40;width:48px;height:48px;border-radius:16px;background:var(--pg);color:#fff;border:none;box-shadow:0 6px 20px rgba(37,99,235,.35);font-size:1.3em;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qr-box{background:#fff;padding:12px;border-radius:14px;display:inline-block;margin:8px auto}
.notif-banner{background:var(--blue-t);border:1px solid color-mix(in srgb,var(--p) 30%,transparent);border-radius:12px;padding:10px 12px;font-size:.85em;margin:8px 0}


/* ===== Human-centered & Privacy v7 ===== */
.priv-lock{font-size:.85em;opacity:.85;margin-right:4px}
.priv-banner{background:linear-gradient(135deg,#ecfdf5,#eff6ff);border:1px solid #a7f3d0;border-radius:12px;padding:10px 12px;font-size:.82em;color:#065f46;margin:8px 0}
body.dark .priv-banner{background:#064e3b33;border-color:#065f46;color:#6ee7b7}
body.privacy .avatar img,body.privacy img.avatar{filter:blur(6px);transform:scale(1.05)}
body.privacy .phone-mask{filter:blur(4px);user-select:none}
.need-tag{font-size:.68em;font-weight:700;padding:2px 8px;border-radius:99px;background:#fef3c7;color:#b45309;border:1px solid #fcd34d}
body.dark .need-tag{background:#78350f44;color:#fbbf24;border-color:#92400e}
.need-tag.sensitive{background:#fce7f3;color:#9d174d;border-color:#f9a8d4}
body.dark .need-tag.sensitive{background:#83184344;color:#f9a8d4}
.need-tag.support{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.care-card{border-right:3px solid var(--p);padding-right:10px}
.role-hint{font-size:.78em;color:var(--tx2);line-height:1.5;margin:6px 0 10px}
.human-msg{background:var(--sf2);border-radius:12px;padding:10px 12px;font-size:.85em;margin:8px 0;border:1px solid var(--ln)}
.human-msg b{color:var(--p)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.toggle-row:last-child{border:none}
.sw{width:44px;height:26px;border-radius:99px;background:var(--ln);position:relative;cursor:pointer;flex-shrink:0;transition:.2s;border:none}
.sw.on{background:var(--p)}
.sw::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on::after{right:21px}
.mask-phone{letter-spacing:.05em}


/* ===== v8 Access, Speed, Safety ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.login-card{width:100%;max-width:360px;background:var(--sf);border-radius:20px;padding:24px;box-shadow:var(--sh);border:1px solid var(--ln)}
.login-card h2{margin:0 0 6px;font-size:1.2em}
.pin-dots{display:flex;gap:10px;justify-content:center;margin:16px 0}
.pin-dots i{width:12px;height:12px;border-radius:50%;background:var(--ln);transition:.15s}
.pin-dots i.on{background:var(--p);transform:scale(1.15)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pin-pad button{min-height:52px;font-size:1.25em;font-weight:800;border-radius:14px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);cursor:pointer;font-family:inherit}
.pin-pad button:active{transform:scale(.96);background:var(--blue-t)}
.user-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--sf2);font-size:.75em;font-weight:700;border:1px solid var(--ln)}
.user-chip b{color:var(--p)}
.quick-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.quick-bar::-webkit-scrollbar{display:none}
.quick-bar .btn{flex-shrink:0;white-space:nowrap}

function storageInfo(){
  try{
    const raw=localStorage.getItem("mct:data")||"";
    const bytes=new Blob([raw]).size;
    const kb=Math.round(bytes/1024);
    const mb=(bytes/1048576).toFixed(2);
    // typical quota ~5MB
    const pct=Math.min(100,Math.round(bytes/5e6*100));
    return{bytes,kb,mb,pct,sessions:Object.keys(Store.get().sessions||{}).length,members:(Store.get().members||[]).length};
  }catch(e){return{bytes:0,kb:0,mb:"0",pct:0,sessions:0,members:0};}
}
function pruneSessions(keep){
  const d=Store.get();
  const keys=Object.keys(d.sessions||{}).sort().reverse();
  const max=keep|| (d.settings.maxSessions||40);
  let n=0;
  for(let i=max;i<keys.length;i++){delete d.sessions[keys[i]];n++;}
  // also prune fees for deleted session keys older than keep
  const feeKeys=Object.keys(d.fees||{}).sort().reverse();
  for(let i=max;i<feeKeys.length;i++){delete d.fees[feeKeys[i]];}
  Store.save();
  return n;
}

function nextClass(){const d=Store.get();if(!d.classes.length&&!(d.extra||[]).length)return null;
const now=new Date();let best=null;
for(let i=0;i<8;i++){const dt=new Date(now);dt.setDate(now.getDate()+i);const dw=(dt.getDay()+1)%7;
for(const c of d.classes){if(c.dow!==dw)continue;
const[h,mi]=c.start.split(":").map(Number);
const t=new Date(dt);t.setHours(h,mi,0,0);
if(t>now-2*3600e3&&(!best||t<best.t))best={t,c,date:Jalali.toJ(dt.getFullYear(),dt.getMonth()+1,dt.getDate())};}}
for(const ex of d.extra||[]){const j=Jalali.fromKey(ex.key);const g=Jalali.toG(j.jy,j.jm,j.jd);
const[h,mi]=(ex.start||"19:00").split(":").map(Number);
const t=new Date(g.gy,g.gm-1,g.gd,h,mi,0,0);
if(t>now-2*3600e3&&(!best||t<best.t))best={t,c:{dow:Jalali.dow(j),start:ex.start,end:ex.end,date:j,extra:true},date:j};}
return best;}

function reportText(ph,full){const d=Store.get(),key=d._lastSession||sessionSel();if(!key)return"";
const s=d.sessions[key]||{},g={present:[],delay:[],absent:[],problem:[],none:[]};
for(const m of d.members){const st=ph===2?((s[m.id]||{}).p2||(s[m.id]||{}).p1):(s[m.id]||{}).p1;
(g[st||"none"]||g.none).push(m);}
const fm=m=>{const ex=s[m.id]||{};let t=m.name;
if(ex.time||ex.time2)t+=" (حدود "+Jalali.toFa(ex.time2||ex.time)+")";
else if(ex.note)t+=" ("+ex.note+")";return t;};
const nc=nextClass(),icon={present:"✅",delay:"⏰",absent:"📭",problem:"💬",none:"—"};
let out="📋 گزارش حضور — "+(nc?Jalali.DN[nc.c.dow]+" "+Jalali.fmt(nc.date):"")+" — "+(ph===1?"نوبت ۱ (تماس‌های قبلی)":"نوبت ۲ (ثبت ورود)")+"\n";
const keys=full?["present","delay","absent","problem","none"]:["delay","absent","problem"];
for(const k of keys)
if(g[k].length)out+=icon[k]+" "+ST.lbl[k]+": "+g[k].map(fm).join("، ")+"\n";
if(!full){const un=g.none.length;if(un)out+="❔ ثبت‌نشده: "+Jalali.toFa(un)+" نفر\n";}
return out;}

/* ============ اکسل: خروج و ورود ============ */
function parseCSV(t){t=t.replace(/^\ufeff/,"");
const rows=[];let row=[],cur="",q=false;
for(let i=0;i<t.length;i++){const c=t[i];
if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
else if(c==='"')q=true;
else if(c===","){row.push(cur);cur="";}
else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;
row.push(cur);cur="";
if(row.some(x=>x!==""))rows.push(row);row=[];}
else cur+=c;}
if(cur!==""||row.length){row.push(cur);if(row.some(x=>x!==""))rows.push(row);}
return rows;}
function dlCSV(rows,name){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
const csv="\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
a.download=name;a.click();toast("✅ فایل اکسل (CSV) دانلود شد");}
function exportCSV(kind,key){const d=Store.get();let rows;
if(kind==="fees"){const f=d.fees[key]||{};
rows=[["نام","تلفن‌ها","وضعیت","تاریخ پرداخت","پیگیری","یادداشت"]];
for(const m of d.members){const st=f[m.id]||{};
rows.push([m.name,(m.phones||[]).join(" / "),st.paid?"پرداخت شد":"پرداخت نشده",st.paid?st.date:"",st.fc==="promised"?"قول داده":st.fc==="noanswer"?"بی‌پاسخ":"",st.note||""]);}}
else if(kind==="attend"){const s=d.sessions[key]||{};
rows=[["نام","تلفن‌ها","تماس قبلی","ساعت","یادداشت","ثبت ورود","ساعت","یادداشت"]];
for(const m of d.members){const c=s[m.id]||{};
rows.push([m.name,(m.phones||[]).join(" / "),c.p1?ST.lbl[c.p1]:"ثبت‌نشده",c.time||"",c.note||"",c.p2?ST.lbl[c.p2]:"ثبت‌نشده",c.time2||"",c.note2||""]);}}
else rows=[["نام","تلفن‌ها","تولد","نقش‌ها","گروه","یادداشت عمومی","نیازها"],...d.members.map(m=>[m.name,(m.phones||[]).join(" / "),m.birth?Jalali.fmt(m.birth):"",(m.roles||[]).join("|"),m.group||"عمومی",m.note||"",(m.needs||[]).join("|")])];
dlCSV(rows,kind+"-"+key+".csv");}
function exportMembersCSV(){exportCSV("members","members");}
function importMembersCSV(inp){const f=inp.files[0];if(!f)return;
const r=new FileReader();r.onload=()=>{try{
const rows=parseCSV(r.result);if(rows.length<2){toast("⚠️ فایل خالی است");return;}
const head=rows[0].map(x=>x.trim());
const hasHead=head.includes("نام");
const ci=n=>head.indexOf(n);
const iName=hasHead?ci("نام"):0;
const iPhone=hasHead?(ci("تلفن")>=0?ci("تلفن"):ci("شماره")):1;
const iBirth=hasHead?ci("تولد"):2;
const iRole=hasHead?ci("نقش‌ها"):3;
const iNote=hasHead?ci("یادداشت"):4;
const d=Store.get();let n=0,skip=0;
for(let i=hasHead?1:0;i<rows.length;i++){
const c=rows[i];const name=(c[iName]||"").trim();
if(!name)continue;
if(d.members.some(x=>x.name===name)){skip++;continue;}
let birth=null;
const bs=(c[iBirth]||"").trim();
const bm=bs.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);
if(bm)birth={jy:+bm[1],jm:+bm[2],jd:+bm[3]};
const phones=(c[iPhone]||"").split(/[\/؛;|]/).map(x=>x.trim()).filter(Boolean);
d.members.push({id:Store.uid(),name,phones,birth,
roles:(c[iRole]||"").split("|").map(x=>x.trim()).filter(Boolean),
note:(c[iNote]||"").trim()});
n++;}
Store.save();render();
toast("✅ "+Jalali.toFa(n)+" عضو اضافه شد"+(skip?" — "+Jalali.toFa(skip)+" تکراری رد شد":""));
}catch(e){toast("⚠️ خواندن فایل ناموفق بود");}};
r.readAsText(f);inp.value="";}
window.exportMembersCSV=exportMembersCSV;window.importMembersCSV=importMembersCSV;

for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();
o.connect(g);g.connect(AC.destination);o.frequency.value=880;o.type="sine";
const t=AC.currentTime+i*.45;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.35);

function reportRoundToHami(ph){try{logActivity("گزارش نوبت "+ph+" به حامی");}catch(e){}
  if(!requirePerm("shareSupport","اجازه ارسال گزارش ندارید"))return;
  const d=Store.get();const key=sessionSel()||curKey();
  if(!key){toast("جلسه مشخص نیست");return;}
  const s=d.sessions[key]||{};
  const g={present:[],delay:[],absent:[],problem:[],none:[]};
  for(const m of d.members){
    const st=ph===2?((s[m.id]||{}).p2||(s[m.id]||{}).p1):(s[m.id]||{}).p1;
    (g[st||"none"]||g.none).push(m);
  }
  const roundName=ph===1?"نوبت ۱ — تماس قبلی (روز/ساعت‌های قبل)":"نوبت ۲ — پشت در کلاس";
  const lines=[];
  lines.push("🤝 گزارش به حامی‌ها");
  lines.push(d.settings.className||"کلاس");
  lines.push(roundName);
  lines.push("جلسه: "+Jalali.fmt(Jalali.fromKey(key)));
  lines.push("");
  const block=(title,arr,icon)=>{
    if(!arr.length)return;
    lines.push(icon+" "+title+" ("+Jalali.toFa(arr.length)+"):");
    arr.forEach(m=>{
      const ex=s[m.id]||{};
      let t="• "+m.name;
      if(ex.time||ex.time2)t+=" (حدود "+Jalali.toFa(ex.time2||ex.time)+")";
      if(ph===1&&ex.note)t+=" — "+ex.note;
      if(ph===2&&ex.note2)t+=" — "+ex.note2;
      lines.push(t);
    });
    lines.push("");
  };
  block("حاضر",g.present,"✅");
  block("تأخیر",g.delay,"⏰");
  block("بدون حضور",g.absent,"📭");
  block("مشکل / نیاز هماهنگی",g.problem,"💬");
  block("هنوز ثبت‌نشده",g.none,"—");
  lines.push("— برای حامی‌ها (اعضای قدیمی پشتیبان) — بدون یادداشت محرمانه —");
  const txt=lines.join("\n");
  const o=modal('<h3 style="font-weight:800">📤 گزارش '+esc(roundName)+'</h3>'+
    '<p class="role-hint">این متن برای حامی‌هاست: پشتیبان مسئولان جدید و رابط با درمانگر.</p>'+
    '<textarea id="rndRep" rows="12" readonly style="font-size:.88em">'+esc(txt)+'</textarea>'+
    '<div class="row" style="margin-top:10px"><button class="btn p" style="flex:1" id="rrCopy">📋 کپی</button><button class="btn g" style="flex:1" id="rrShare">📤 ارسال</button></div>');
  $("#rrCopy",o).onclick=()=>copyTxt(txt);
  $("#rrShare",o).onclick=()=>shareTxt(txt);
}

/* مهلت شهریه: یک روز قبل از کلاس */
function feeDeadlineInfo(){
  const d=Store.get();const days=d.settings.feeDeadlineDays!=null?d.settings.feeDeadlineDays:1;
  const nc=nextClass();
  if(!nc)return{ok:true,text:"کلاسی تنظیم نشده",overdue:[],days};
  const deadline=new Date(nc.t.getTime()-days*864e5);
  const now=new Date();
  const key=Jalali.toKey(nc.date);
  const f=d.fees[key]||{};
  const overdue=d.members.filter(m=>!(f[m.id]&&f[m.id].paid));
  const past=now>=deadline;
  return{ok:!past||!overdue.length,past,deadline,nc,key,overdue,days,text:past?("مهلت واریز گذشته — "+Jalali.toFa(overdue.length)+" نفر هنوز واریز نکرده‌اند"):("مهلت واریز: تا "+Jalali.fmt(Jalali.toJ(deadline.getFullYear(),deadline.getMonth()+1,deadline.getDate()))+" (یک روز قبل از کلاس)")};
}

function sessionCompareHTML(){
  const d=Store.get();
  const keys=Object.keys(d.sessions||{}).sort().reverse();
  if(keys.length<1)return"";
  const calc=key=>{
    const s=d.sessions[key]||{};
    let p=0,a=0,n=d.members.length||1;
    d.members.forEach(m=>{
      const st=(s[m.id]||{}).p2||(s[m.id]||{}).p1;
      if(st==="present"||st==="delay")p++;
      else if(st==="absent"||st==="problem")a++;
    });
    return{key,pct:Math.round(p/n*100),p,a};
  };
  const cur=calc(keys[0]);
  const prev=keys[1]?calc(keys[1]):null;
  let h='<div class="card fade-up"><h3>📊 مقایسه جلسات</h3><div class="compare-grid">';
  h+='<div class="box"><div class="stat-line">آخرین جلسه</div><div class="n">'+Jalali.toFa(cur.pct)+'٪</div><div class="stat-line">'+Jalali.fmt(Jalali.fromKey(cur.key))+'</div></div>';
  if(prev)h+='<div class="box"><div class="stat-line">جلسه قبل</div><div class="n">'+Jalali.toFa(prev.pct)+'٪</div><div class="stat-line">'+(cur.pct-prev.pct>=0?"+":"")+Jalali.toFa(cur.pct-prev.pct)+'٪ نسبت به قبل</div></div>';
  else h+='<div class="box"><div class="stat-line">جلسه قبل</div><div class="n">—</div></div>';
  h+='</div></div>';
  return h;
}

function buildStoryCard(kind){
  // kind: attend | fees
  const d=Store.get();
  const key=sessionSel()||curKey();
  const canvas=document.createElement("canvas");
  canvas.width=1080;canvas.height=1920;
  const ctx=canvas.getContext("2d");
  // gradient bg
  const g=ctx.createLinearGradient(0,0,0,1920);
  g.addColorStop(0,"#1d4ed8");g.addColorStop(0.5,"#2563eb");g.addColorStop(1,"#0ea5e9");
  ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);
  // soft circles
  ctx.fillStyle="rgba(255,255,255,.06)";
  ctx.beginPath();ctx.arc(200,400,300,0,6.3);ctx.fill();
  ctx.beginPath();ctx.arc(900,1400,400,0,6.3);ctx.fill();
  ctx.fillStyle="#fff";
  ctx.textAlign="center";
  ctx.font="bold 54px Tahoma,sans-serif";
  ctx.fillText(d.settings.className||"کلاس",540,280);
  ctx.font="32px Tahoma,sans-serif";
  ctx.fillStyle="rgba(255,255,255,.85)";
  const dateStr=key?Jalali.fmt(Jalali.fromKey(key)):Jalali.fmt(Jalali.today());
  ctx.fillText(dateStr,540,360);
  let title="گزارش حضور", lines=[];
  if(kind==="fees"){
    title="گزارش شهریه";
    const f=key?(d.fees[key]||{}):{};
    const paid=d.members.filter(m=>f[m.id]&&f[m.id].paid).length;
    const un=d.members.length-paid;
    lines=["پرداخت‌شده: "+paid, "باقی‌مانده: "+un, "کل اعضا: "+d.members.length];
  }else{
    const s=key?(d.sessions[key]||{}):{};
    let p=0,del=0,ab=0,pr=0;
    d.members.forEach(m=>{
      const st=(s[m.id]||{}).p2||(s[m.id]||{}).p1;
      if(st==="present")p++;else if(st==="delay")del++;else if(st==="absent")ab++;else if(st==="problem")pr++;
    });
    lines=["حاضر: "+p,"تأخیر: "+del,"بدون حضور: "+ab,"نیاز هماهنگی: "+pr];
  }
  ctx.font="bold 64px Tahoma,sans-serif";
  ctx.fillStyle="#fff";
  ctx.fillText(title,540,520);
  ctx.font="bold 48px Tahoma,sans-serif";
  lines.forEach((ln,i)=>{
    ctx.fillStyle="rgba(255,255,255,.95)";
    ctx.fillText(ln,540,680+i*100);
  });
  ctx.font="28px Tahoma,sans-serif";
  ctx.fillStyle="rgba(255,255,255,.7)";
  ctx.fillText("My-Class-Track · برای حامی‌ها",540,1750);
  ctx.fillText("با احترام و حفظ حریم اعضا",540,1800);
  return canvas;
}

function assignMap(kind){
  const d=Store.get();
  d.assignments=d.assignments||{attend:{},fee:{}};
  if(!d.assignments[kind])d.assignments[kind]={};
  return d.assignments[kind];
}
function myAssigneeId(){
  const u=currentUser();
  if(!u)return null;
  const d=Store.get();
  if(u.memberId)return u.memberId;
  const m=d.members.find(x=>x.name===u.name);
  return m?m.id:("user:"+u.id);
}
function isMine(kind, memberId){
  const map=assignMap(kind);
  const aid=map[memberId];
  if(!aid)return true;

function assigneeName(kind, memberId){
  const map=assignMap(kind);
  const aid=map[memberId];
  if(!aid)return"";
  const d=Store.get();
  if(String(aid).indexOf("user:")===0){
    const uid=aid.slice(5);
    const u=(d.users||[]).find(x=>x.id===uid);
    return u?u.name:"";
  }
  const m=d.members.find(x=>x.id===aid);
  return m?m.name:"";
}
function periodLeadIds(kind){
  const d=Store.get();
  const p=d.period||{};
  let leadIds=kind==="fee"?(p.feeIds||[]).slice():(p.attendIds||[]).slice();
  if(!leadIds.length){
    const role=kind==="fee"?"fee":"attend";
    leadIds=d.members.filter(m=>(m.roles||[]).includes(role)).map(m=>m.id);
  }
  return leadIds;
}
function autoSplitTasks(kind){

  const members=d.members.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),"fa"));
  members.forEach((m,i)=>{map[m.id]=leadIds[i%leadIds.length];});

}
function workloadHTML(kind){
  const d=Store.get();
  const leadIds=periodLeadIds(kind);

  const map=assignMap(kind);

  leadIds.forEach(lid=>{
    const lead=d.members.find(m=>m.id===lid);

  });

  d.pinned=d.pinned||[];

function isPinned(id){return (Store.get().pinned||[]).indexOf(id)>=0;}
function smartSortMembers(list, kind){
  const d=Store.get();
  if(!d.settings.smartSort)return list;
  const key=sessionSel()||curKey();
  const s=key?(kind==="fee"?(d.fees[key]||{}):(d.sessions[key]||{})):{};
  const pinned=d.pinned||[];
  return list.slice().sort((a,b)=>{
    const pa=pinned.indexOf(a.id)>=0?0:1;
    const pb=pinned.indexOf(b.id)>=0?0:1;
    if(pa!==pb)return pa-pb;
    let da=0,db=0;
    if(kind==="fee"){
      da=(s[a.id]&&s[a.id].paid)?1:0;
      db=(s[b.id]&&s[b.id].paid)?1:0;
    }else{
      da=((s[a.id]||{}).p1||(s[a.id]||{}).p2)?1:0;
      db=((s[b.id]||{}).p1||(s[b.id]||{}).p2)?1:0;
    }
    if(da!==db)return da-db; // pending first
    const ma=isMine(kind,a.id)?0:1;
    const mb=isMine(kind,b.id)?0:1;
    if(ma!==mb)return ma-mb;
    return String(a.name).localeCompare(String(b.name),"fa");
  });
}

function performUndo(){
  const d=Store.get();
  const u=(d.undoStack||[]).pop();
  if(!u){toast("چیزی برای بازگشت نیست");return;}
  if(u.type==="att"){
    d.sessions[u.key]=d.sessions[u.key]||{};
    if(u.prev==null)delete d.sessions[u.key][u.mid];
    else d.sessions[u.key][u.mid]=u.prev;
  }else if(u.type==="fee"){
    d.fees[u.key]=d.fees[u.key]||{};
    if(u.prev==null)delete d.fees[u.key][u.mid];
    else d.fees[u.key][u.mid]=u.prev;
  }
  Store.save();
  document.getElementById("undoBar")&&document.getElementById("undoBar").classList.remove("show");
  toast("↩ بازگردانده شد");
  render();
}
function absenceRisk(id){
  const d=Store.get();
  const keys=Object.keys(d.sessions||{}).sort().reverse().slice(0,8);
  if(keys.length<3)return0;
  let abs=0,total=0;
  keys.forEach(k=>{
    const st=(d.sessions[k][id]||{}).p2||(d.sessions[k][id]||{}).p1;
    if(!st)return;
    total++;
    if(st==="absent"||st==="problem")abs++;
  });
  if(total<3)return0;
  return abs/total;
}
function riskChip(id){
  const r=absenceRisk(id);
  if(r>=0.5)return'<span class="assignee-chip risk-hi">ریسک بالا</span> ';
  if(r>=0.3)return'<span class="assignee-chip risk-mid">نیاز توجه</span> ';
  return"";
}

function Pages_login(el){
  const d=Store.get();
  const users=d.users||[];
  let sel=users[0]?users[0].id:"";
  let pin="";
  const draw=()=>{
    el.innerHTML='<div class="login-wrap"><div class="login-card fade-up">'+
      '<div class="logo" style="margin:0 auto 12px;width:48px;height:48px;font-size:1.2em">M</div>'+
      '<h2 style="text-align:center">ورود به '+(esc(d.settings.className||"کلاس"))+'</h2>'+
      '<p class="stat-line" style="text-align:center">سطح دسترسی جدا برای مدیر، حامی، پیگیر و مشاهده‌گر</p>'+
      '<label>کاربر</label><select id="loginUser">'+users.map(u=>'<option value="'+u.id+'" '+(u.id===sel?"selected":"")+'>'+esc(u.name)+' — '+(ROLE_LABEL[u.role]||u.role)+'</option>').join("")+'</select>'+
      '<div class="pin-dots" id="pinDots">'+[0,1,2,3].map(i=>'<i class="'+(i<pin.length?"on":"")+'"></i>').join("")+'</div>'+
      '<div class="pin-pad" id="pinPad">'+
      [1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(x=>{
        if(x==="")return'<span></span>';
        return'<button type="button" data-k="'+x+'">'+x+'</button>';
      }).join("")+'</div>'+
      '<p class="safe-tip">رمز پیش‌فرض مدیر: ۰۰۰۰ — از تنظیمات عوض کنید. داده روی همین دستگاه می‌ماند.</p></div></div>';
    $("#loginUser",el).onchange=e=>{sel=e.target.value;pin="";draw();};
    el.querySelectorAll("#pinPad button").forEach(b=>{
      b.onclick=()=>{
        const k=b.getAttribute("data-k");
        if(k==="⌫"){pin=pin.slice(0,-1);draw();return;}
        if(pin.length>=4)return;
        pin+=k;draw();
        if(pin.length===4){
          if(!loginUser(sel,pin)){pin="";
            const card=el.querySelector(".login-card");if(card){card.classList.add("err-shake");setTimeout(()=>card.classList.remove("err-shake"),400);}
            draw();
          }
        }
      };
    });
  };
  draw();
}

function saveUserForm(id){
  if(!requirePerm("settings","فقط مدیر می‌تواند کاربر تعریف کند"))return;
  const d=Store.get();
  const name=($("#uName")&&$("#uName").value||"").trim();
  const pin=($("#uPin")&&$("#uPin").value||"").trim();
  const role=$("#uRole")?$("#uRole").value:"follow";
  if(!name){toast("نام کاربر را وارد کنید");return;}
  if(!/^\d{4}$/.test(pin)){toast("رمز باید ۴ رقم باشد");return;}
  if(id){
    const u=d.users.find(x=>x.id===id);if(!u)return;
    u.name=name;u.pin=pin;u.role=role;
  }else{
    d.users.push({id:Store.uid(),name,pin,role});
  }
  Store.save();render();toast("✅ کاربر ذخیره شد");
}

function reportForSupporters(){
  if(!requirePerm("shareSupport","اجازه ارسال گزارش به حامی را ندارید"))return;
  const d=Store.get();const key=sessionSel();

function computeInsights(){
  const d=Store.get(),keys=Object.keys(d.sessions||{}).sort();
  const total=d.members.length||1;
  let presentRate=[],absentLeaders={},payRate=0,paidN=0,feeKeys=Object.keys(d.fees||{});
  keys.slice(-8).forEach(k=>{
    const s=d.sessions[k]||{};let p=0;
    d.members.forEach(m=>{const st=(s[m.id]||{}).p2||(s[m.id]||{}).p1;if(st==="present"||st==="delay")p++;if(st==="absent")absentLeaders[m.id]=(absentLeaders[m.id]||0)+1;});
    presentRate.push(Math.round(p/total*100));
  });
  const lastFee=feeKeys.sort().reverse()[0];
  if(lastFee){const f=d.fees[lastFee]||{};d.members.forEach(m=>{if(f[m.id]&&f[m.id].paid)paidN++;});payRate=Math.round(paidN/total*100);}
  const topAbs=Object.entries(absentLeaders).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id,n])=>{
    const m=d.members.find(x=>x.id===id);return m?{name:m.name,n}:null;}).filter(Boolean);
  const avg=presentRate.length?Math.round(presentRate.reduce((a,b)=>a+b,0)/presentRate.length):0;
  const trend=presentRate.length>=2?(presentRate[presentRate.length-1]-presentRate[0]):0;
  return{presentRate,avg,trend,topAbs,payRate,sessions:keys.length,spark:presentRate};
}
function ringSVG(pct,size=72){
  const r=28,c=2*Math.PI*r,off=c-(pct/100)*c;
  const col=pct>=80?"#10b981":pct>=50?"#f59e0b":"#ef4444";
  return'<div class="ring-wrap"><svg width="'+size+'" height="'+size+'" viewBox="0 0 72 72"><circle cx="36" cy="36" r="'+r+'" fill="none" stroke="var(--sf2)" stroke-width="7"/><circle cx="36" cy="36" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" style="transition:stroke-dashoffset .6s"/></svg><div class="ring-val">'+Jalali.toFa(pct)+'٪</div></div>';
}
function sparkHTML(arr){
  if(!arr||!arr.length)return"";
  const mx=Math.max(100,...arr);
  return'<div class="spark">'+arr.map(v=>'<i style="height:'+Math.max(8,v/mx*100)+'%" title="'+v+'%"></i>').join("")+"</div>";
}

function startSpeech(targetId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("⚠️ مرورگر از تشخیص گفتار پشتیبانی نمی‌کند");return;}
  if(_recActive&&_recog){_recog.stop();return;}
  _recog=new SR();_recog.lang="fa-IR";_recog.interimResults=false;_recog.continuous=false;
  _recActive=true;
  const btn=document.querySelector("[data-speech=\""+targetId+"\"]");
  if(btn)btn.classList.add("rec");
  toast("🎤 صحبت کنید…");
  try{if(navigator.vibrate)navigator.vibrate(30);}catch(e){}
  _recog.onresult=e=>{
    const t=e.results[0][0].transcript;
    const el=document.getElementById(targetId);
    if(el){el.value=(el.value?el.value+" ":"")+t;el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}));}
    toast("✅ متن ثبت شد");
  };
  _recog.onerror=()=>toast("⚠️ تشخیص گفتار ناموفق");
  _recog.onend=()=>{_recActive=false;if(btn)btn.classList.remove("rec");};
  _recog.start();
}
function speechBtn(targetId){
  if(!speechSupported())return"";
  return'<button type="button" class="btn sm ghost chip-mic" data-speech="'+targetId+'" onclick="startSpeech(\''+targetId+'\')" aria-label="گفتار به متن">🎤</button>';
}

/* ============ v6: اعلان کلاس (Notification API) ============ */
async function enableNotifs(){
  if(!("Notification" in window)){toast("⚠️ مرورگر از اعلان پشتیبانی نمی‌کند");return;}
  let p=Notification.permission;
  if(p==="default")p=await Notification.requestPermission();
  if(p!=="granted"){toast("اجازه اعلان داده نشد");return;}
  const d=Store.get();d.settings.notif=true;Store.save();
  scheduleClassNotif();
  toast("✅ اعلان کلاس فعال شد");
}
function scheduleClassNotif(){
  const d=Store.get();
  if(!d.settings.notif||Notification.permission!=="granted")return;
  const nc=nextClass();if(!nc||!nc.t)return;
  const ms=nc.t-Date.now()-15*60e3; // 15 min before
  if(ms<0||ms>864e5*2)return;
  clearTimeout(window._notifT);
  window._notifT=setTimeout(()=>{
    try{
      new Notification(d.settings.className||"کلاس",{body:"۱۵ دقیقه تا شروع کلاس — ساعت "+(nc.c.start||""),icon:"icon.svg",tag:"mct-class"});
      if(navigator.vibrate)navigator.vibrate([80,40,80]);
    }catch(e){}
  },ms);
}

/* ============ v6: نقشه حرارتی حضور ============ */
function attendHeatmap(){
  const d=Store.get(),keys=Object.keys(d.sessions||{}).sort().slice(-28);
  if(!keys.length)return'<p class="stat-line">هنوز جلسه‌ای ثبت نشده</p>';
  const days=["ش","ی","د","س","چ","پ","ج"];
  let h='<div class="heat">'+days.map(x=>'<div class="hd">'+x+'</div>').join("");
  // pad start based on first session dow
  const first=Jalali.fromKey(keys[0]);const firstDow=Jalali.dow(first);
  for(let i=0;i<firstDow;i++)h+='<div class="c" style="opacity:.25"></div>';
  keys.forEach(k=>{
    const s=d.sessions[k]||{};let p=0,t=d.members.length||1;
    d.members.forEach(m=>{const st=(s[m.id]||{}).p2||(s[m.id]||{}).p1;if(st==="present"||st==="delay")p++;});
    const pct=p/t*100;let lv=pct>=90?"lv4":pct>=70?"lv3":pct>=40?"lv2":pct>0?"lv1":"";
    const j=Jalali.fromKey(k);
    h+='<div class="c '+lv+'" title="'+Jalali.fmt(j)+' — '+Math.round(pct)+'٪" onclick="setSel(\''+k+'\');go(\'attend\')"></div>';
  });
  h+="</div>";
  return h;
}

/* ============ v6: خروجی تقویم ICS ============ */
function exportICS(){
  const d=Store.get(),lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MCT//My-Class-Track//FA","CALSCALE:GREGORIAN"];
  const name=d.settings.className||"کلاس";
  // next 8 weeks of regular classes
  const now=new Date();
  for(let i=0;i<56;i++){
    const dt=new Date(now);dt.setDate(now.getDate()+i);const dw=(dt.getDay()+1)%7;
    for(const c of d.classes){
      if(c.dow!==dw)continue;
      const[h,mi]=(c.start||"19:00").split(":").map(Number);
      const[eh,emi]=(c.end||"21:00").split(":").map(Number);
      const start=new Date(dt);start.setHours(h,mi,0,0);
      const end=new Date(dt);end.setHours(eh,emi,0,0);
      const fmt=x=>x.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
      lines.push("BEGIN:VEVENT","UID:mct-"+fmt(start)+"@mct","DTSTAMP:"+fmt(new Date()),"DTSTART:"+fmt(start),"DTEND:"+fmt(end),"SUMMARY:"+name,"DESCRIPTION:جلسه کلاس — My-Class-Track","END:VEVENT");
    }
  }
  (d.extra||[]).forEach(ex=>{
    const j=Jalali.fromKey(ex.key);const g=Jalali.toG(j.jy,j.jm,j.jd);
    const[h,mi]=(ex.start||"19:00").split(":").map(Number);
    const[eh,emi]=(ex.end||"21:00").split(":").map(Number);
    const start=new Date(g.gy,g.gm-1,g.gd,h,mi);const end=new Date(g.gy,g.gm-1,g.gd,eh,emi);
    const fmt=x=>{const p=n=>String(n).padStart(2,"0");return x.getFullYear()+p(x.getMonth()+1)+p(x.getDate())+"T"+p(x.getHours())+p(x.getMinutes())+"00";};
    lines.push("BEGIN:VEVENT","UID:mct-ex-"+ex.key+"@mct","DTSTAMP:"+fmt(new Date()),"DTSTART:"+fmt(start),"DTEND:"+fmt(end),"SUMMARY:"+name+" (جلسه خاص)","END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob=new Blob([lines.join("\r\n")],{type:"text/calendar;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mct-schedule.ics";a.click();
  toast("✅ تقویم دانلود شد — در تقویم گوشی Import کنید");
}

}

function printAttendReport(key){
  const d=Store.get();key=key||sessionSel();
  if(!key){toast("⚠️ جلسه‌ای انتخاب نشده");return;}
  const s=d.sessions[key]||{};
  const title=(d.settings.className||"کلاس")+" — گزارش حضور "+Jalali.fmt(Jalali.fromKey(key));
  let rows="";
  for(const m of d.members){
    const c=s[m.id]||{};
    const p1=ST.lbl[c.p1||"none"], p2=ST.lbl[c.p2||"none"];
    rows+="<tr><td>"+esc(m.name)+"</td><td>"+p1+(c.time?" ("+Jalali.toFa(c.time)+")":"")+"</td><td>"+p2+(c.time2?" ("+Jalali.toFa(c.time2)+")":"")+"</td><td>"+esc(c.note2||c.note||"")+"</td></tr>";
  }
  const html=`<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title>
  <style>
  body{font-family:Tahoma,sans-serif;padding:24px;color:#111;font-size:13px}
  h1{font-size:18px;margin:0 0 4px} .sub{color:#555;margin-bottom:16px}
  table{width:100%;border-collapse:collapse} th,td{border:1px solid #ccc;padding:8px;text-align:right}
  th{background:#f0f4ff} .foot{margin-top:20px;font-size:11px;color:#666}
  @media print{button{display:none}}
  </style></head><body>
  <button onclick="window.print()" style="padding:10px 16px;margin-bottom:12px;font-family:inherit;cursor:pointer">🖨 چاپ / ذخیره PDF</button>
  <h1>${esc(title)}</h1>
  <div class="sub">تعداد اعضا: ${Jalali.toFa(d.members.length)} — تاریخ چاپ: ${Jalali.fmt(Jalali.today())}</div>
  <table><thead><tr><th>نام</th><th>تماس قبلی</th><th>ثبت ورود</th><th>یادداشت</th></tr></thead>
  <tbody>${rows}</tbody></table>
  <div class="foot">My-Class-Track — گزارش خودکار</div>
  <script>setTimeout(()=>window.print(),400)<\/script>
  </body></html>`;
  const w=window.open("","_blank");
  if(!w){toast("⚠️ پاپ‌آپ مسدود است");return;}
  w.document.write(html);w.document.close();
}

function addGroup(){
  const name=prompt("نام گروه جدید:");
  if(!name||!name.trim())return;
  const d=Store.get();
  if(d.groups.includes(name.trim())){toast("این گروه از قبل هست");return;}
  d.groups.push(name.trim());Store.save();render();toast("✅ گروه اضافه شد");
}
function delGroup(g){
  if(g==="عمومی"){toast("گروه «عمومی» قابل حذف نیست");return;}
  confirm2("گروه «"+g+"» حذف شود؟ اعضای آن به عمومی منتقل می‌شوند",()=>{
    const d=Store.get();
    d.groups=d.groups.filter(x=>x!==g);
    d.members.forEach(m=>{if(m.group===g)m.group="عمومی";});
    Store.save();render();
  });
}
