<style>

<script>
"use strict";
/* ============ تقویم شمسی (jalaali) ============ */
const Jalali=(()=>{const br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;
function cal(jy){let gy=jy+621,lJ=-14,jp=br[0],jm,jump=0,n,i;
for(i=1;i<br.length;i++){jm=br[i];jump=jm-jp;if(jy<jm)break;lJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm;}
n=jy-jp;lJ+=div(n,33)*8+div(mod(n,33)+3,4);
if(mod(jump,33)===4&&jump-n===4)lJ++;
const lG=div(gy,4)-div((div(gy,100)+1)*3,4)-150,march=20+lJ-lG;
if(jump-n<6)n=n-jump+div(jump+4,33)*33;
let leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;
return{leap,gy,march};}
const g2d=(gy,gm,gd)=>{let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;};
const d2g=j=>{let jj=4*j+139361631;jj=jj+div(div(4*j+183187720,146097)*3,4)*4-3908;const i=div(mod(jj,1461),4)*5+308;return{gd:div(mod(i,153),5)+1,gm:mod(div(i,153),12)+1,gy:div(jj,1461)-100100+div(8-(mod(div(i,153),12)+1),6)};};
function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=cal(jy),j1=g2d(gy,3,r.march);let k=jdn-j1;
if(k>=0){if(k<=185)return{jy,jm:1+div(k,31),jd:mod(k,31)+1};k-=186;}
else{jy--;k+=179;if(r.leap===1)k++;}
return{jy,jm:7+div(k,30),jd:mod(k,30)+1};}
const toG=(jy,jm,jd)=>{const r=cal(jy);return d2g(g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1);};
const mLen=(jy,jm)=>jm<=6?31:jm<=11?30:(cal(jy).leap===0?30:29);
const MN=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const DN=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];
const toFa=s=>String(s).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const fmt=j=>toFa(j.jy+"/"+String(j.jm).padStart(2,"0")+"/"+String(j.jd).padStart(2,"0"));
const today=()=>{const d=new Date();return toJ(d.getFullYear(),d.getMonth()+1,d.getDate());};
const toKey=j=>j.jy+"-"+String(j.jm).padStart(2,"0")+"-"+String(j.jd).padStart(2,"0");
const fromKey=k=>{const p=k.split("-");return{jy:+p[0],jm:+p[1],jd:+p[2]};};
const dow=j=>{const g=toG(j.jy,j.jm,j.jd);return(new Date(g.gy,g.gm-1,g.gd).getDay()+1)%7;};
const toJ=(gy,gm,gd)=>d2j(g2d(gy,gm,gd));
return{toJ,toG,mLen,today,fmt,toFa,toKey,fromKey,dow,MN,DN};})();

/* ============ لایه داده (نسخه ۴) ============ */
const Store=(()=>{const KEY="mct:data";
const DEF={v:4,members:[],classes:[{dow:3,start:"19:00",end:"21:00"}],extra:[],sessions:{},fees:{},homework:[],
settings:{theme:null,fs:"m",color:"blue",alarmTimes:[15,8,5,3],sound:false},timer:null};
let data;
function load(){try{data=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){data=null;}
if(!data){data=JSON.parse(JSON.stringify(DEF));return;}
if(data.v<4){
(data.members||[]).forEach(m=>{if(m.phone&&!m.phones)m.phones=[m.phone];if(!m.phones)m.phones=[];});
data.extra=data.extra||[];data.v=4;}
data.settings=Object.assign({},DEF.settings,data.settings||{});}
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
load();
return{get:()=>data,save,reset(){data=JSON.parse(JSON.stringify(DEF));save();},
importObj(o){if(!o||typeof o!=="object"||!Array.isArray(o.members))throw 0;
o.members.forEach(m=>{if(m.phone&&!m.phones)m.phones=[m.phone];if(!m.phones)m.phones=[];});
o.extra=o.extra||[];o.v=4;data=o;save();},
uid:()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6)};})();

clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),3200);}

function copyTxt(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast("✅ کپی شد")).catch(()=>_cp(t));else _cp(t);}
function _cp(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("✅ کپی شد");}catch(e){toast("کپی ناموفق");}a.remove();}

let _au=null;
function playAud(src){try{if(!src)return;if(_au){_au.pause();}_au=new Audio(src);_au.play();}catch(e){toast("پخش ناموفق");}}
const AUD={};let _ai=0;
function audBtn(src,label){if(!src)return"";const k="a"+(++_ai);AUD[k]=src;
return'<button class="btn sm ghost" data-aud="'+k+'" aria-label="'+(label||"پخش صدا")+'">▶️</button>';}
function recordVoice(cb,cur){
const o=modal('<h3 style="font-weight:800">🎙 ضبط صدا</h3><div style="text-align:center;padding:8px"><div class="rec-time" id="recT">۰:۰۰</div>'+
'<div class="row" style="justify-content:center;margin-top:10px"><button class="btn d" id="recGo" style="min-width:130px">● شروع ضبط</button>'+
(cur?'<button class="btn ghost" id="recPlay">▶️ پخش قبلی</button><button class="btn ghost" id="recDel">🗑 حذف</button>':"")+"</div>"+
'<p class="stat-line" style="margin-top:8px">حداکثر ۶۰ ثانیه — برای صرفه‌جویی در حافظه دستگاه</p></div>'+
'<div class="row" style="margin-top:10px"><button class="btn p" style="flex:1" id="recOk">تأیید</button><button class="btn ghost" id="recCl">انصراف</button></div>');
let result=cur||null,mr=null,chunks=[],t0=null,iv=null;
const tm=$("#recT",o);
 $("#recCl",o).onclick=()=>{if(mr&&mr.state==="recording")mr.stop();if(iv)clearInterval(iv);o.remove();};
 $("#recOk",o).onclick=()=>{const wasRec=mr&&mr.state==="recording";
if(wasRec)mr.stop();if(iv)clearInterval(iv);
o.remove();
if(wasRec)setTimeout(()=>cb(result),450);else cb(result);};
if(cur){$("#recPlay",o).onclick=()=>playAud(cur);
 $("#recDel",o).onclick=()=>{result=null;$("#recPlay",o).remove();$("#recDel",o).remove();toast("حذف شد");};}
 $("#recGo",o).onclick=async()=>{
if(mr&&mr.state==="recording"){mr.stop();return;}
try{
const st=await navigator.mediaDevices.getUserMedia({audio:true});
mr=new MediaRecorder(st);chunks=[];
mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());
if(!chunks.length)return;
const b=new Blob(chunks,{type:mr.mimeType||"audio/webm"});
const r=new FileReader();r.onload=()=>{result=r.result;
const go=$("#recGo",o);if(go){go.textContent="● شروع مجدد";go.className="btn d";}};
r.readAsDataURL(b);};
mr.start();t0=Date.now();
const go=$("#recGo",o);go.textContent="■ توقف";go.className="btn ghost";
iv=setInterval(()=>{const s=~~((Date.now()-t0)/1000);
tm.textContent=~~(s/60)+":"+String(s%60).padStart(2,"0");
if(s>=60&&mr&&mr.state==="recording"){mr.stop();toast("⏱ حداکثر زمان ضبط");}},250);
}catch(e){toast("⚠️ دسترسی به میکروفون داده نشد");}};
}

function nextClass(){const d=Store.get();if(!d.classes.length&&!(d.extra||[]).length)return null;
const now=new Date();let best=null;
for(let i=0;i<8;i++){const dt=new Date(now);dt.setDate(now.getDate()+i);const dw=(dt.getDay()+1)%7;
for(const c of d.classes){if(c.dow!==dw)continue;
const[h,mi]=c.start.split(":").map(Number);
const t=new Date(dt);t.setHours(h,mi,0,0);
if(t>now-2*3600e3&&(!best||t<best.t))best={t,c,date:Jalali.toJ(dt.getFullYear(),dt.getMonth()+1,dt.getDate())};}}
for(const ex of d.extra||[]){const j=Jalali.fromKey(ex.key);const g=Jalali.toG(j.jy,j.jm,j.jd);
const[h,mi]=(ex.start||"19:00").split(":").map(Number);
const t=new Date(g.gy,g.gm-1,g.gd,h,mi,0,0);
if(t>now-2*3600e3&&(!best||t<best.t))best={t,c:{dow:Jalali.dow(j),start:ex.start,end:ex.end,date:j,extra:true},date:j};}
return best;}
function curKey(){const nc=nextClass();return nc?Jalali.toKey(nc.date):null;}

function tick(){const r=target-Date.now(),cd=$("#cd");if(!cd)return;

cd.textContent=Jalali.toFa(mm)+":"+Jalali.toFa(String(ss).padStart(2,"0"));

if(r<=th*6e4&&!(d2.timer.fired||[]).includes(th)&&r>th*6e4-10*6e4){
d2.timer.fired=(d2.timer.fired||[]).concat(th);Store.save();showBigAlert(th);}}}

function toggleCallFilter(){UI.callOnly=!UI.callOnly;UI.filter="";render();}
function setAtt(key,mid,ph,st){const d=Store.get();
if(!key){toast("⚠️ اول کلاس را در تنظیمات ثبت کنید");return;}
d._lastSession=key;d.sessions[key]=d.sessions[key]||{};
const cur=d.sessions[key][mid]=d.sessions[key][mid]||{};
const tF=ph==="p1"?"time":"time2",nF=ph==="p1"?"note":"note2";
const was=cur[ph];
if(cur[ph]===st){cur[ph]=null;delete cur[tF];delete cur[nF];}
else cur[ph]=st;
Store.save();
const y=window.scrollY;
if(route==="entry")renderEntry();else render();
window.scrollTo(0,y);
if(cur[ph]&&was!==cur[ph]){
const mm=d.members.find(m=>m.id===mid);if(!mm)return;
toastUndo("📝 "+mm.name+": "+ST.lbl[cur[ph]],()=>{
const c=d.sessions[key][mid];c[ph]=null;
delete c[ph==="p1"?"time":"time2"];delete c[ph==="p1"?"note":"note2"];
Store.save();route==="entry"?renderEntry():render();});
}
if(ph==="p2"&&d.members.length&&d.members.every(m=>!needsCall((d.sessions[key][m.id]||{}).p2)))
celebrate("🎉 همه اعضا حاضرند — کلاس کامل است!");}

/* ---- گزارش‌ها ---- */
function reportText(ph,full){const d=Store.get(),key=d._lastSession||sessionSel();if(!key)return"";
const s=d.sessions[key]||{},g={present:[],delay:[],absent:[],problem:[],none:[]};
for(const m of d.members){const st=ph===2?((s[m.id]||{}).p2||(s[m.id]||{}).p1):(s[m.id]||{}).p1;
(g[st||"none"]||g.none).push(m);}
const fm=m=>{const ex=s[m.id]||{};let t=m.name;
if(ex.time||ex.time2)t+=" (حدود "+Jalali.toFa(ex.time2||ex.time)+")";
else if(ex.note)t+=" ("+ex.note+")";return t;};
const nc=nextClass(),icon={present:"✅",delay:"⏰",absent:"❌",problem:"⚠️",none:"❔"};
let out="📋 گزارش حضور — "+(nc?Jalali.DN[nc.c.dow]+" "+Jalali.fmt(nc.date):"")+" — "+(ph===1?"نوبت ۱ (تماس‌های قبلی)":"نوبت ۲ (ثبت ورود)")+"\n";
const keys=full?["present","delay","absent","problem","none"]:["delay","absent","problem"];
for(const k of keys)
if(g[k].length)out+=icon[k]+" "+ST.lbl[k]+": "+g[k].map(fm).join("، ")+"\n";
if(!full){const un=g.none.length;if(un)out+="❔ ثبت‌نشده: "+Jalali.toFa(un)+" نفر\n";}
return out;}
function feeReportText(){const d=Store.get(),key=curFeeKey(),f=d.fees[key]||{};
const paid=d.members.filter(m=>f[m.id]&&f[m.id].paid);
const un=d.members.filter(m=>!(f[m.id]&&f[m.id].paid));
const promised=un.filter(m=>(f[m.id]||{}).fc==="promised");
const noans=un.filter(m=>(f[m.id]||{}).fc==="noanswer");
const notYet=un.filter(m=>!(f[m.id]||{}).fc);
const nc=nextClass();
return"💰 گزارش شهریه — "+(nc?Jalali.DN[nc.c.dow]+" "+Jalali.fmt(nc.date):"")+"\n"+
"✅ پرداخت‌شده ("+Jalali.toFa(paid.length)+"): "+(paid.map(m=>m.name).join("، ")||"—")+"\n"+
"🗣 قول داده ("+Jalali.toFa(promised.length)+"): "+(promised.map(m=>m.name).join("، ")||"—")+"\n"+
"📵 بی‌پاسخ ("+Jalali.toFa(noans.length)+"): "+(noans.map(m=>m.name).join("، ")||"—")+"\n"+
"⏳ پیگیری‌نشده ("+Jalali.toFa(notYet.length)+"): "+(notYet.map(m=>m.name).join("، ")||"—");}

modal("<h3 style='font-weight:800'>📨 گزارش نوبت "+ph+"</h3>"+
'<div class="row" style="margin-bottom:8px"><button class="chip'+(!UI.repFull?" on":"")+'" id="rShort">کوتاه</button><button class="chip'+(UI.repFull?" on":"")+'" id="rFull">کامل</button></div>'+

navigator.share({files:[file],title:"پشتیبان My-Class-Track"}).catch(()=>{});

function restore(inp){const f=inp.files[0];if(!f)return;

r.readAsText(f);inp.value="";}

/* ============ اکسل: خروج و ورود ============ */
function parseCSV(t){t=t.replace(/^\ufeff/,"");
const rows=[];let row=[],cur="",q=false;
for(let i=0;i<t.length;i++){const c=t[i];
if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
else if(c==='"')q=true;
else if(c===","){row.push(cur);cur="";}
else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;
row.push(cur);cur="";
if(row.some(x=>x!==""))rows.push(row);row=[];}
else cur+=c;}
if(cur!==""||row.length){row.push(cur);if(row.some(x=>x!==""))rows.push(row);}
return rows;}
function dlCSV(rows,name){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
const csv="\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
a.download=name;a.click();toast("✅ فایل اکسل (CSV) دانلود شد");}
function exportCSV(kind,key){const d=Store.get();let rows;
if(kind==="fees"){const f=d.fees[key]||{};
rows=[["نام","تلفن‌ها","وضعیت","تاریخ پرداخت","پیگیری","یادداشت"]];
for(const m of d.members){const st=f[m.id]||{};
rows.push([m.name,(m.phones||[]).join(" / "),st.paid?"پرداخت شد":"پرداخت نشده",st.paid?st.date:"",st.fc==="promised"?"قول داده":st.fc==="noanswer"?"بی‌پاسخ":"",st.note||""]);}}
else if(kind==="attend"){const s=d.sessions[key]||{};
rows=[["نام","تلفن‌ها","تماس قبلی","ساعت","یادداشت","ثبت ورود","ساعت","یادداشت"]];
for(const m of d.members){const c=s[m.id]||{};
rows.push([m.name,(m.phones||[]).join(" / "),c.p1?ST.lbl[c.p1]:"ثبت‌نشده",c.time||"",c.note||"",c.p2?ST.lbl[c.p2]:"ثبت‌نشده",c.time2||"",c.note2||""]);}}
else rows=[["نام","تلفن‌ها","تولد","نقش‌ها","یادداشت"],...d.members.map(m=>[m.name,(m.phones||[]).join(" / "),m.birth?Jalali.fmt(m.birth):"",(m.roles||[]).join("|"),m.note])];
dlCSV(rows,kind+"-"+key+".csv");}
function exportMembersCSV(){exportCSV("members","members");}
function importMembersCSV(inp){const f=inp.files[0];if(!f)return;
const r=new FileReader();r.onload=()=>{try{
const rows=parseCSV(r.result);if(rows.length<2){toast("⚠️ فایل خالی است");return;}
const head=rows[0].map(x=>x.trim());
const hasHead=head.includes("نام");
const ci=n=>head.indexOf(n);
const iName=hasHead?ci("نام"):0;
const iPhone=hasHead?(ci("تلفن")>=0?ci("تلفن"):ci("شماره")):1;
const iBirth=hasHead?ci("تولد"):2;
const iRole=hasHead?ci("نقش‌ها"):3;
const iNote=hasHead?ci("یادداشت"):4;
const d=Store.get();let n=0,skip=0;
for(let i=hasHead?1:0;i<rows.length;i++){
const c=rows[i];const name=(c[iName]||"").trim();
if(!name)continue;
if(d.members.some(x=>x.name===name)){skip++;continue;}
let birth=null;
const bs=(c[iBirth]||"").trim();
const bm=bs.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);
if(bm)birth={jy:+bm[1],jm:+bm[2],jd:+bm[3]};
const phones=(c[iPhone]||"").split(/[\/؛;|]/).map(x=>x.trim()).filter(Boolean);
d.members.push({id:Store.uid(),name,phones,birth,
roles:(c[iRole]||"").split("|").map(x=>x.trim()).filter(Boolean),
note:(c[iNote]||"").trim()});
n++;}
Store.save();render();
toast("✅ "+Jalali.toFa(n)+" عضو اضافه شد"+(skip?" — "+Jalali.toFa(skip)+" تکراری رد شد":""));
}catch(e){toast("⚠️ خواندن فایل ناموفق بود");}};
r.readAsText(f);inp.value="";}
window.exportMembersCSV=exportMembersCSV;window.importMembersCSV=importMembersCSV;

a.innerHTML='<div style="font-size:4em">⏰</div><div class="msg">به دکتر بگویید:<br>'+Jalali.toFa(min)+" دقیقه مانده</div><button class='btn' style='padding:14px 40px;font-size:1.05em' id='okA'>باشه</button>";
document.body.appendChild(a);document.getElementById("okA").onclick=()=>a.remove();}
let AC=null;
function beep(n){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();
o.connect(g);g.connect(AC.destination);o.frequency.value=880;o.type="sine";
const t=AC.currentTime+i*.45;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.35);
o.start(t);o.stop(t+.4);}}catch(e){}}
