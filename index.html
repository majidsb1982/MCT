<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fe">
<meta name="description" content="دستیار گروه درمانی — My-Class-Track">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script>
window.addEventListener("load",function(){
  var fontSheet=document.createElement("link");
  fontSheet.rel="stylesheet";
  fontSheet.href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/Vazirmatn-font-face.css";
  document.head.appendChild(fontSheet);
},{once:true});
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="stylesheet" href="css/app.css?v=120">
<title>My-Class-Track</title>
</head>
<body>
<header id="hdr"><div class="hwrap">
  <button type="button" class="hbtn" id="backBtn" onclick="goBack()" aria-label="بازگشت" style="display:none">→</button>
  <div class="logo" aria-hidden="true">M</div>
  <div><div class="htitle">My-Class-Track</div><div class="hsub">گروه درمانی</div></div>
  <button type="button" class="hbtn first" id="exitBtn" onclick="exitApp()" aria-label="خانه یا خروج" title="خانه / خروج">⌂</button>
  <button type="button" class="hbtn" onclick="toggleFS()" aria-label="تمام‌صفحه">⛶</button>
  <button type="button" class="hbtn" id="themeBtn" onclick="toggleTheme()" aria-label="تغییر تم">🌙</button>
  <button type="button" class="hbtn install-btn" id="installBtn" aria-label="نصب برنامه روی موبایل" title="نصب برنامه روی موبایل">⬇</button>
</div></header>
<main id="app" class="page" role="main"></main>
<div id="bootError" hidden role="alert" style="margin:16px;padding:16px;border:1px solid #dc2626;border-radius:14px;background:#fff;color:#7f1d1d;direction:rtl;line-height:1.8"><b>برنامه کامل بارگذاری نشد</b><p id="bootErrorText"></p></div>
<script>(function(){function show(message){var box=document.getElementById("bootError"),text=document.getElementById("bootErrorText");if(box&&text){box.hidden=false;text.textContent=message;}}window.addEventListener("error",function(event){if(event.message)show("خطای اجرا: "+event.message);else if(event.target&&event.target.src)show("فایل بارگذاری نشد: "+event.target.src);},true);window.addEventListener("unhandledrejection",function(event){show("خطای برنامه: "+String(event.reason||"نامشخص"));});window.addEventListener("load",function(){setTimeout(function(){var app=document.getElementById("app");if(app&&!app.children.length)show("محتوای برنامه ساخته نشد؛ صفحه را دوباره بارگذاری کنید.");},4000);});})();</script>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav id="nav" aria-label="ناوبری اصلی"></nav>
<script src="js/core.js?v=120"></script>
<script src="js/pages.js?v=120"></script>
<script src="js/features.js?v=120"></script>
<script src="js/app.js?v=120"></script>
<script>
(function(){
  var deferredPrompt=null,btn=document.getElementById("installBtn");
  var standalone=window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
  if(!btn)return;
  if(standalone){btn.hidden=true;return;}
  window.addEventListener("beforeinstallprompt",function(event){event.preventDefault();deferredPrompt=event;btn.title="نصب برنامه";btn.setAttribute("aria-label","نصب برنامه روی موبایل");btn.textContent="⬇";});
  btn.addEventListener("click",async function(){
    if(deferredPrompt){
      var promptEvent=deferredPrompt;deferredPrompt=null;
      try{await promptEvent.prompt();await promptEvent.userChoice;}catch(e){}
      return;
    }
    var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    var msg=ios
      ?"برای نصب روی آیفون یا آیپد:\n۱) این صفحه را در Safari باز کنید.\n۲) دکمهٔ اشتراک‌گذاری را بزنید.\n۳) گزینهٔ «Add to Home Screen» یا «افزودن به صفحهٔ اصلی» را انتخاب کنید.\n\nپس از افزودن، برنامه از آیکون صفحهٔ اصلی باز می‌شود."
      :"برای نصب روی اندروید:\n۱) این صفحه را در Chrome باز کنید.\n۲) منوی سه‌نقطه را باز کنید.\n۳) «Install app» یا «افزودن به صفحهٔ اصلی» را بزنید.\n\nاگر گزینه را نمی‌بینید، صفحه را یک‌بار با اینترنت باز کنید و کمی بعد دوباره بررسی کنید.";
    window.alert(msg);
  });
  window.addEventListener("appinstalled",function(){btn.hidden=true;deferredPrompt=null;});
})();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js?v=120").then(function(reg){return reg.update();}).catch(function(){});
  });
}
</script>
</body>
</html>
