<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fe">
<meta name="description" content="دستیار گروه درمانی — پیگیری حضور، شهریه، تکالیف و گزارش‌ها">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css">
<title>My-Class-Track</title>
</head>
<body>
<header id="hdr"><div class="hwrap">
  <button class="hbtn" id="backBtn" onclick="goBack()" aria-label="بازگشت به صفحه قبل" title="بازگشت به صفحه قبل" style="display:none">←</button>
  <div class="logo" aria-hidden="true">M</div>
  <div><div class="htitle">My-Class-Track</div><div class="hsub">گروه درمانی</div></div>
  <button class="hbtn first" id="exitBtn" onclick="exitApp()" aria-label="رفتن به خانه" title="رفتن به خانه">⌂</button>
  <button class="hbtn" onclick="toggleFS()" aria-label="تمام‌صفحه">⛶</button>
  <button class="hbtn" id="themeBtn" onclick="toggleTheme()" aria-label="تغییر تم">🌙</button>
</div></header>
<div id="app" class="page" role="main"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav id="nav" aria-label="ناوبری اصلی"></nav>
<script src="js/core.js"></script>
<script src="js/pages.js"></script>
<script src="js/features.js"></script>
<script src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => console.warn("Service worker registration failed", err));
  });
}
</script>
</body>
</html>
