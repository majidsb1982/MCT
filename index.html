<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fe">
<meta name="description" content="دستیار گروه درمانی — My-Class-Track">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css?v=38">
<title>My-Class-Track</title>
</head>
<body>
<header id="hdr"><div class="hwrap">
  <button type="button" class="hbtn" id="backBtn" onclick="goBack()" aria-label="بازگشت" style="display:none">→</button>
  <div class="logo" aria-hidden="true">M</div>
  <div><div class="htitle">My-Class-Track</div><div class="hsub">گروه درمانی</div></div>
  <button type="button" class="hbtn first" id="exitBtn" onclick="exitApp()" aria-label="خانه یا خروج" title="خانه / خروج">⌂</button>
  <button type="button" class="hbtn" onclick="toggleFS()" aria-label="تمام‌صفحه">⛶</button>
  <button type="button" class="hbtn" id="themeBtn" onclick="toggleTheme()" aria-label="تغییر تم">🌙</button>
</div></header>
<main id="app" class="page" role="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav id="nav" aria-label="ناوبری اصلی"></nav>
<div id="bootError" style="display:none;margin:16px;padding:16px;border:1px solid #dc2626;border-radius:14px;background:#fff;color:#7f1d1d;direction:rtl;font-family:system-ui,sans-serif;line-height:1.8"><b>برنامه کامل بارگذاری نشد</b><p id="bootErrorText"></p></div><script>(function(){function show(m){var b=document.getElementById("bootError"),t=document.getElementById("bootErrorText");if(b&&t){b.style.display="block";t.textContent=m;}}window.addEventListener("error",function(e){if(e.message)show("خطای اجرا: "+e.message);else if(e.target&&e.target.src)show("فایل بارگذاری نشد: "+e.target.src);},true);window.addEventListener("unhandledrejection",function(e){show("خطای برنامه: "+String(e.reason||"نامشخص"));});window.addEventListener("load",function(){setTimeout(function(){var a=document.getElementById("app");if(a&&!a.children.length)show("محتوای برنامه ساخته نشد؛ لطفاً از این پیام عکس بفرستید.");},4000);});})();</script><script src="js/core.js?v=38"></script>
<script src="js/pages.js?v=38"></script>
<script src="js/features.js?v=38"></script>
<script src="js/app.js?v=38"></script>
<script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js?v=38").then(function(r){return r.update();}).catch(function(){});});}</script></body>
</html>
