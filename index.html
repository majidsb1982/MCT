<!doctype html>

<head>

<title>My-Class-Track | دستیار کلاس</title>
<style>
/* styles loaded from full CSS - see complete file in release */
:root{--p:#2563eb;--p2:#38bdf8;--pg:linear-gradient(135deg,#2563eb,#38bdf8);--pg2:linear-gradient(135deg,#3b82f6,#60a5fa);--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--prob:#f97316;--bg:#f4f7fe;--sf:#ffffff;--sf2:#eef4fd;--tx:#1e293b;--tx2:#64748b;--ln:#e3eaf5;--blue-t:#2563eb14;--sh:0 6px 20px rgba(37,99,235,.08);--sh2:0 4px 12px rgba(37,99,235,.12);--r:16px}
body.dark{--bg:#0b1220;--sf:#141e33;--sf2:#1c2a45;--tx:#f1f5f9;--tx2:#8ea0bd;--ln:#24334f;--blue-t:#2563eb22;--sh:0 6px 20px rgba(0,0,0,.4);--sh2:0 4px 12px rgba(0,0,0,.35)}
body.c-teal{--p:#0d9488;--p2:#2dd4bf;--pg:linear-gradient(135deg,#0d9488,#2dd4bf);--pg2:linear-gradient(135deg,#14b8a6,#5eead4);--blue-t:#0d948814}
body.dark.c-teal{--blue-t:#0d948822}
body.c-purple{--p:#7c3aed;--p2:#a78bfa;--pg:linear-gradient(135deg,#7c3aed,#a78bfa);--pg2:linear-gradient(135deg,#8b5cf6,#c4b5fd);--blue-t:#7c3aed14}
body.dark.c-purple{--blue-t:#7c3aed22}
body.c-warm{--p:#ea580c;--p2:#fb923c;--pg:linear-gradient(135deg,#ea580c,#fb923c);--pg2:linear-gradient(135deg,#f97316,#fdba74);--blue-t:#ea580c14}
body.dark.c-warm{--blue-t:#ea580c22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:var(--fs,15px);padding:60px 0 80px;transition:background .25s,color .25s}
h3{font-size:1em;margin:0 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.card.hero{background:var(--pg);border:none;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(37,99,235,.3)}
header{position:fixed;top:0;right:0;left:0;z-index:50;background:var(--sf);border-bottom:1px solid var(--ln)}
.hwrap{max-width:640px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--pg);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.htitle{font-weight:800;font-size:clamp(.9em,4vw,1.05em)}.hsub{font-size:.64em;color:var(--tx2)}
.hbtn{background:var(--sf);border:1px solid var(--ln);border-radius:11px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1em;box-shadow:var(--sh);flex-shrink:0}
#app{max-width:640px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;right:0;left:0;z-index:50;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;color:var(--tx2);font-family:inherit;font-size:.7em;font-weight:700;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--p)}
nav svg{width:22px;height:22px;fill:currentColor}
.btn{border:none;border-radius:13px;padding:11px 16px;font-family:inherit;font-size:.97em;font-weight:700;cursor:pointer;min-height:44px;background:var(--sf2);color:var(--tx)}
.btn.p{background:var(--pg);color:#fff}.btn.g{background:var(--ok);color:#fff}.btn.d{background:var(--bad);color:#fff}.btn.ghost{background:transparent;border:1.5px solid var(--ln)}.btn.sm{padding:7px 12px;min-height:38px;font-size:.86em;border-radius:11px}
.row{display:flex;gap:8px;align-items:center}.chip{border:1.5px solid var(--ln);background:var(--sf);color:var(--tx2);border-radius:99px;padding:7px 14px;font-family:inherit;font-size:.83em;font-weight:700;cursor:pointer;min-height:38px}.chip.on{background:var(--blue-t);border-color:var(--p);color:var(--p)}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--ln);border-radius:13px;background:var(--sf);color:var(--tx);font-family:inherit;font-size:.97em;min-height:44px}
label{display:block;font-size:.82em;color:var(--tx2);margin:8px 0 4px;font-weight:600}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:12px 18px;border-radius:14px;font-size:.9em;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90%}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}.modal{background:var(--sf);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:640px;max-height:90vh;overflow:auto}
.avatar{width:40px;height:40px;border-radius:12px;object-fit:cover;background:var(--pg);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.mem{display:flex;align-items:center;gap:10px;padding:8px 0}.badge{font-size:.72em;font-weight:700;padding:3px 8px;border-radius:8px}.b-ok{background:#10b98122;color:#10b981}.b-warn{background:#f59e0b22;color:#f59e0b}.b-bad{background:#ef444422;color:#ef4444}.b-prob{background:#f9731622;color:#f97316}.b-m{background:var(--sf2);color:var(--tx2)}.b-p{background:var(--blue-t);color:var(--p)}
.progress{height:7px;border-radius:99px;background:var(--sf2);overflow:hidden;margin:6px 0 3px}.progress i{display:block;height:100%;background:var(--pg);border-radius:99px}
.st-btn{flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid var(--ln);background:var(--sf);font-family:inherit;font-size:.8em;font-weight:700;cursor:pointer;min-height:40px}.st-btn.on1{background:#10b981;color:#fff;border-color:#10b981}.st-btn.on2{background:#f59e0b;color:#fff;border-color:#f59e0b}.st-btn.on3{background:#ef4444;color:#fff;border-color:#ef4444}.st-btn.on4{background:#f97316;color:#fff;border-color:#f97316}
.empty{text-align:center;padding:28px 12px;color:var(--tx2)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.stat-line{font-size:.8em;color:var(--tx2)}.task-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln);cursor:pointer}.task-row .t-title{font-weight:700}.task-row .t-sub{font-size:.78em;color:var(--tx2)}.task-row .t-go{margin-right:auto;color:var(--p);font-weight:900}
@media print{header,nav,.btn,nav *,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.card{box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<header id="hdr"><div class="hwrap">
  <button class="hbtn" id="backBtn" onclick="goBack()" aria-label="بازگشت" style="display:none">→</button>
  <div class="logo">M</div>
  <div><div class="htitle">My-Class-Track</div><div class="hsub">دستیار کلاس</div></div>
  <button class="hbtn first" onclick="toggleFS()" aria-label="تمام‌صفحه">⛶</button>
  <button class="hbtn" id="themeBtn" onclick="toggleTheme()" aria-label="تغییر تم">🌙</button>
</div></header>
<div id="app"></div>
<div class="toast" id="toast"></div>
<nav id="nav"></nav>
<script src="app.js" defer></script>
</body>
</html>
